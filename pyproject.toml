[project]
name = "expirylens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.29",
    "dagster-webserver>=1.13.29",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
