[project]
name = "expirylens"
version = "0.1.0"
description = "Expiry-day settlement surveillance for Indian index derivatives"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.29",
    "dagster-webserver>=1.13.29",
    "duckdb>=2.0.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
