# local services for expirylens
# start:  docker compose up -d
# stop:   docker compose down

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: expirylens-db
    environment:
      POSTGRES_USER: expiry
      POSTGRES_DB: expirylens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expiry -d expirylens"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
